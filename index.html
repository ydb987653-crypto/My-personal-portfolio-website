<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

                <div class="info-item"><strong>CSS</strong></div>

            </div>

        <section class="contact-section">
            <h2 class="section-title">Contact</h2>
            <p>Email: abdoeid@example.com</p>
